name: spike-windows-askpass

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Which ssh, and does its binary know SSH_ASKPASS?
        shell: pwsh
        run: |
          $ssh = (Get-Command ssh).Source
          Write-Host "ssh path : $ssh"
          ssh -V 2>&1 | Write-Host
          $bytes = [IO.File]::ReadAllBytes($ssh)
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($needle in @("SSH_ASKPASS", "SSH_ASKPASS_REQUIRE", "DISPLAY", "askpass")) {
            Write-Host ("contains {0,-20} {1}" -f $needle, $text.Contains($needle))
          }

      - name: Does an askpass helper get invoked at all?
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "asked.txt"
          $helper = Join-Path $env:RUNNER_TEMP "ask.bat"
          # the helper records that it ran and answers with a fake code
          Set-Content -Path $helper -Value "@echo off`r`necho called>>`"$marker`"`r`necho 00000000"
          $env:SSH_ASKPASS = $helper
          $env:SSH_ASKPASS_REQUIRE = "force"
          $env:DISPLAY = ":0"
          # a closed port fails before auth, so also try the loopback sshd Windows
          # ships: enable it, then connect with password auth only.
          Write-Host "--- attempt 1: closed port (no prompt expected) ---"
          ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no `
              -o NumberOfPasswordPrompts=1 -o ConnectTimeout=5 `
              -o StrictHostKeyChecking=no nobody@127.0.0.1 -p 65000 2>&1 | Write-Host
          $global:LASTEXITCODE = 0
          Write-Host ("helper invoked: {0}" -f (Test-Path $marker))

      - name: Start a real sshd and see whether askpass answers it
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          Start-Service sshd
          $marker = Join-Path $env:RUNNER_TEMP "asked2.txt"
          $helper = Join-Path $env:RUNNER_TEMP "ask2.bat"
          Set-Content -Path $helper -Value "@echo off`r`necho called>>`"$marker`"`r`necho wrongpassword"
          $env:SSH_ASKPASS = $helper
          $env:SSH_ASKPASS_REQUIRE = "force"
          $env:DISPLAY = ":0"
          Write-Host "--- attempt 2: loopback sshd, password auth ---"
          $out = ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no `
                     -o NumberOfPasswordPrompts=1 -o ConnectTimeout=5 `
                     -o StrictHostKeyChecking=no "$env:USERNAME@127.0.0.1" "echo hi" 2>&1
          $out | Write-Host
          $global:LASTEXITCODE = 0
          Write-Host ("helper invoked: {0}" -f (Test-Path $marker))
          if (Test-Path $marker) { Write-Host ("marker content: " + (Get-Content $marker -Raw)) }
